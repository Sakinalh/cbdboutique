name: CI

on:
  pull_request:
  push:
    branches: [main]

# Une nouvelle poussée sur la même PR annule l'exécution précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version de pnpm lue dans le champ `packageManager` de package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm turbo run lint typecheck test build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build API image
        run: >-
          docker build
          -f apps/api/Dockerfile
          -t cbd-api
          --build-arg NODE_VERSION=$(cat .nvmrc)
          .

      - name: Smoke test /health
        run: |
          docker run -d -p 3000:3000 --name api cbd-api
          curl --fail --retry 10 --retry-delay 1 --retry-all-errors http://localhost:3000/health

      - name: Show container logs
        if: failure()
        run: docker logs api
